name: tests
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint (CI only)
        run: uvx ruff check .
      - name: Tests
        run: uv run python -m pytest tests/ -v
